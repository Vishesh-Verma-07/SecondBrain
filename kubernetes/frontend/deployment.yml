apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: secondBrain

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: visheshverma07/second-brain-frontend:IMAGE_TAG

          ports:
            - containerPort: 3000

          